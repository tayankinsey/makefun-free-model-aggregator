# One server a trial: 180 seconds for 20 requests and their provider calls, 1 CPU and 2 GB, and 64
# processes. model_calls: optional, so a pure-code server is a legal entry.
limits:
  cpus: 1
  memory_mb: 2048
  pids: 64
  wall_budget_sec: 180

# The efficiency view's authorship gate (bot-01's 0.80): no prize rides on that view.
min_authored_coverage: 0.8

# A house entry that beats the field holds the place it finishes in, unpaid, and no entry moves up; the
# Prizes section says so. No house bar: no entry has to beat a baseline to take a place.
house_holds_places: true

# The escrow is funded when the bundle opens (contest-design.mdc), so the lifecycle job locks the final
# at the deadline and the chain sync resolves it; payouts auto pays a screened claim.
automation:
  lifecycle: true
  payouts: auto
  escrow: at_open
