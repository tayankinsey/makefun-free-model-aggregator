      - "Staged final: every final entry runs the first scored instance once; the 60 best there and any tied with the 60th run all 3, each trial replayed; contenders rank on their mean score over the 3, and every other entry ranks below them by its score on the first"
      - "Ties: an exact tie goes to the entry that made fewer provider calls, then the earlier receipt"
      - "Prizes: $100 for 1st place, $70 for 2nd, $50 for 3rd, $20 each for 4th to 10th and $14 each for 11th to 20th, one place per entrant, paid in USDC on Solana; a paid place a house bot holds is not awarded, and no entry moves up to take it"
      - "Payout: in USDC on Solana only, and the bounty's page says which way: when the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to the entrant's account and each winner claims the prize from the escrow to that wallet once the result is posted, a prize nobody wins or claims going back to make.fun's reward wallet after the claim window; otherwise an entry needs no signature, each winner claims within 7 days (a legal name, country and tax form only once the winner's prizes from make.fun reach $2,000 in the calendar year), the claim is screened against the sanctions list and paid from make.fun's reward wallet, at once to a wallet linked by signature when the automatic checks clear it, and an unclaimed prize passes to the next entry in the standings"
      - "Reproducible: the generator, the env, the scorer and the practice instances are published, and every trial's state export lets anyone rescore it against the reference"
    source: "The 3 scored instances drawn from the scored drand round, and each trial's state export (every request's response, its checks, and the provider calls the env observed)"
    verifier: "make.fun grader runs every trial live against the sealed env, replays every contender's trials and scores each state export with the sealed scorer against the instance's reference; the results are published and resolved automatically"
    tie_break: "An exact tie goes to the entry that made fewer provider calls, then the earlier receipt"
    announce: "Final leaderboard within 7 days of the deadline unless a check holds it; in USDC on Solana, winners claim from make.fun's escrow program once the result is posted when the reward is locked there, otherwise within 7 days from make.fun's reward wallet"
    metric:
      name: Score
      unit: points
      better: higher

harness:
  kind: agent/v1
  runtimes: [node22, python3.13]
  generator:
    runtime: node22
    entrypoint: generator/draw.mjs
  env:
    runtime: node22
    entrypoint: env/server.mjs
  scorer:
    runtime: node22
    entrypoint: scorer/score.mjs
  generator_sha256: "0ce4ade1c09dd36d07fa9ec157e3b1865a50d90743faf79ce48b0dca1c96107d"
  env_sha256: "8068f615861313a976a012591e693d7c6e9bbb72d04e63e4570ee43a1e304be2"
  scorer_sha256: "09d52b959af2b65f510c41efd5a017f4235637a1b9fdb53698ebf826c356b97e"
  # The contract's minimum (as tiny-chess-01's): the entry's server makes no model call of its own, so this
  # only bounds one that is made. model_calls: optional waives the LLM agent floor for every entry.
  inference:
    models:
      - claude-haiku-5-5
    budget_usd_per_trial: 0.01
    max_requests_per_trial: 1
    max_output_tokens_per_request: 1
    max_request_bytes: 4096
    max_total_usd: 1
    dev_daily_usd: 0.1
  # The staged final: no practice floor (0, so every entry reaches it), 3 scored instances, and the 60 best
  # entrants on the first (every tie with the 60th included) run all 3. 60 is 3 x the 20 paid places.
  trials:
    final_instances: 3
    practice_instances: 3
    staged:
      contenders: 60
      practice_floor: 0
  entry:
    max_file_bytes: 8388608
    max_tree_bytes: 16777216
  model_calls: optional

phases:
  - key: dev
    title: Development
    description: Each submission runs one practice trial, live only and not replayed, on the first of the 3 practice instances drawn from a round emitted before the competition opens; its score appears as it lands.
    starts_at: "2026-11-14T02:30:00Z"
    ends_at: "2026-11-16T02:30:00Z"
    scores: live
  - key: final
    title: Final
    description: Every final entry runs the first of the 3 scored instances once, live and unreplayed, on instances drawn from the first drand round emitted at or after this phase starts, and the 60 best there, with any tied with the 60th, run all 3, each trial live and then replayed. Contenders rank on their mean score over the 3; the results publish themselves once the final grades and the checks after them are done.
    starts_at: "2026-11-16T02:40:00Z"
    ends_at: "2026-11-16T10:40:00Z"
    scores: after_finalize

# The scorer's columns (src/shared/protocol.ts COLUMNS, in board order): the score, the five weighted
# components, upstream_calls (the tie-break: an exact tie goes to fewer provider calls) and the working
# flag (1 when at least one request was answered validly, else 0). The score column rounds to 3
# significant figures in public rows, as every agent bundle's rank column does (catalogue.test.ts).
leaderboard:
  title: Results
  primary_index: 0
  tie_break_index: 6
  columns:
    - {key: score, title: Score, index: 0, sorting: desc, precision: 2, significant_figures: 3}
    - {key: quality, title: Quality, index: 1, sorting: desc, precision: 0}
    - {key: served, title: Served, index: 2, sorting: desc, precision: 0}
    - {key: wire, title: Wire, index: 3, sorting: desc, precision: 0}
    - {key: failover, title: Failover, index: 4, sorting: desc, precision: 0}
    - {key: catalog, title: Catalog, index: 5, sorting: desc, precision: 0}
    - {key: upstream_calls, title: Calls, index: 6, sorting: asc, precision: 0}
    - {key: working, title: Working, index: 7, sorting: desc, precision: 0}

# At most 10 submissions a day and 20 in all, per entrant. The rules and the description quote both;
# change them together.
submission_rule:
  rule: Force_Last
  max_per_day: 10
  max_total: 20
  transcripts_required: true
  strategy_note_required: false
  license: osi
  repo_created_after_open: true
  house_only: false

# The release's twenty-place table: $100 / $70 / $50 / $20 for 4th to 10th / $14 for 11th to 20th, $500 in
# all. The rules and the resolution quote it, and it is the table reward_usd sums to.
prizes:
